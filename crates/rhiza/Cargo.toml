[package]
name = "rhizadb"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embeddable facade for rhiza replicated state machines"

[lib]
name = "rhizadb"

[[test]]
name = "graph_embedded"
required-features = ["graph"]

[[test]]
name = "kv_embedded"
required-features = ["kv"]

[features]
default = ["sql"]
sql = ["dep:rhiza-sql", "rhiza-node/sql"]
graph = ["dep:rhiza-graph", "rhiza-node/graph"]
kv = ["dep:rhiza-kv", "rhiza-node/kv"]
recorder-postcard-rpc = ["rhiza-node/recorder-postcard-rpc"]
# Non-production synchronization API used only by integration tests that must
# pause the real service activation boundary.
test-hooks = ["rhiza-node/test-hooks"]

[dependencies]
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rhiza-archive = { version = "0.3.0", path = "../rhiza-archive" }
rhiza-core = { version = "0.3.0", path = "../rhiza-core" }
rhiza-graph = { version = "0.2.0", path = "../rhiza-graph", optional = true }
rhiza-kv = { version = "0.1.0", path = "../rhiza-kv", optional = true }
rhiza-log = { version = "0.3.0", path = "../rhiza-log" }
rhiza-node = { version = "0.4.0", path = "../rhiza-node", default-features = false }
rhiza-quepaxa = { version = "0.3.0", path = "../rhiza-quepaxa" }
rhiza-sql = { version = "0.3.0", path = "../rhiza-sql", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true

[dev-dependencies]
rcgen = "0.14"
rhiza-obj-store = { version = "0.3.0", path = "../rhiza-obj-store" }
rhiza-quepaxa = { version = "0.3.0", path = "../rhiza-quepaxa", features = ["test-hooks"] }
tempfile.workspace = true
