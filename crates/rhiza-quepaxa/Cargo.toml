[package]
name = "rhiza-quepaxa"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Transport-independent QuePaxa consensus engine used by rhiza"
readme = "README.md"
keywords = ["consensus", "quepaxa", "distributed-systems"]
categories = ["algorithms", "database"]

[features]
# Instrumentation available only to downstream test harnesses. It is not part
# of the consensus runtime's normal feature set.
test-hooks = []
# Checkpoint-archive GC APIs pull rhiza-archive -> object_store (native aws-lc).
# Disabled by default so consensus consumers can depend on the engine without
# that stack. Taldra keeps this off (see TALDRA.md).
archive-gc = ["dep:rhiza-archive"]

[dependencies]
getrandom.workspace = true
rhiza-core = { version = "0.3.0", path = "../rhiza-core" }
rhiza-archive = { version = "0.3.0", path = "../rhiza-archive", optional = true }
serde.workspace = true

[dev-dependencies]
proptest = "1"
rhiza-obj-store = { version = "0.3.0", path = "../rhiza-obj-store" }
rhiza-sql = { version = "0.3.0", path = "../rhiza-sql" }
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
