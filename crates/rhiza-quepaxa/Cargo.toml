[package]
name = "rhiza-quepaxa"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Transport-independent QuePaxa consensus engine used by rhiza"
readme = "README.md"
keywords = ["consensus", "quepaxa", "distributed-systems"]
categories = ["algorithms", "database"]

[features]
# Instrumentation available only to downstream test harnesses. It is not part
# of the consensus runtime's normal feature set.
test-hooks = []

[dependencies]
getrandom.workspace = true
rhiza-core = { version = "0.3.0", path = "../rhiza-core" }
serde.workspace = true

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
tempfile.workspace = true
