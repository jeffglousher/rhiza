[package]
name = "rhiza-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Client library for interacting with rhiza nodes"

[features]
default = ["sql"]
sql = ["rhiza-node/sql", "dep:rhiza-sql"]
graph = ["rhiza-node/graph"]
kv = ["rhiza-node/kv"]
tuner = ["rhiza-node/tuner", "dep:rhiza-tuner"]

[dependencies]
reqwest.workspace = true
rhiza-core = { version = "0.3.0", path = "../rhiza-core" }
rhiza-node = { version = "0.4.0", path = "../rhiza-node", default-features = false }
rhiza-sql = { version = "0.3.0", path = "../rhiza-sql", optional = true }
rhiza-tuner = { version = "0.1.0", path = "../rhiza-tuner", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum.workspace = true
