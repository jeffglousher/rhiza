[package]
name = "rhiza-tuner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MAB-based preferred-proposer and hedge-delay auto-tuning for rhiza"
publish = false

[features]
default = []
shadow = []
proposer-canary = ["shadow"]
hedge-canary = ["proposer-canary"]
default-on = ["hedge-canary"]

[dependencies]
rhiza-core = { version = "0.3.0", path = "../rhiza-core" }
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest = "1"
tempfile.workspace = true

[[bench]]
name = "tuner_eval"
harness = false

[[bench]]
name = "five_peer_benchmark"
harness = false
