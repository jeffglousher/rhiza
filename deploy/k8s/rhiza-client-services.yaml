apiVersion: v1
kind: Service
metadata:
  name: rhiza-sql-client
  labels:
    app.kubernetes.io/name: rhiza
    app.kubernetes.io/component: client
    rhiza.dev/execution-profile: sql
spec:
  selector:
    app.kubernetes.io/name: rhiza
    rhiza.dev/execution-profile: sql
    rhiza.dev/member-role: voter
  ports:
    - name: client
      port: 8080
      targetPort: client
