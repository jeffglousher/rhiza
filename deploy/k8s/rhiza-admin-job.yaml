apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  labels:
    app.kubernetes.io/name: rhiza-live-admin
    rhiza.dev/execution-profile: "__EXECUTION_PROFILE__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: __CURL_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              exec curl --fail-with-body --silent --show-error \
                --connect-timeout 5 --max-time 90 \
                -X '__METHOD__' \
                -H "Authorization: Bearer ${RHIZA_ADMIN_TOKEN}" \
                -H 'x-rhiza-version: 1' \
                -H 'Content-Type: application/json' \
                --data '__BODY__' \
                'http://__POD__.__SERVICE__:8080__PATH__'
          env:
            - name: RHIZA_EXECUTION_PROFILE
              value: __EXECUTION_PROFILE__
            - name: RHIZA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: __AUTH_SECRET__
                  key: admin-token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
