name: Chaos qualification image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GHCR tag for the SQL image
        required: true
        type: string

concurrency:
  group: chaos-image-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push SQL qualification image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          build-args: RHIZA_PROFILE=sql
          tags: ghcr.io/${{ github.repository }}-sql:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.rhiza.qualification=chaos
          cache-from: type=gha,scope=chaos-rhiza-sql-amd64
          cache-to: type=gha,mode=max,scope=chaos-rhiza-sql-amd64,ignore-error=true
      - name: Verify published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-sql:${{ inputs.tag }}
        run: docker buildx imagetools inspect "$IMAGE"
