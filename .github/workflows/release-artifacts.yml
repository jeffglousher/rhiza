name: Release artifacts

on:
  release:
    types: [published]

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  cli:
    name: CLI (${{ matrix.profile }}, ${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: [sql, graph, kv]
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            vcpkg: x64-windows
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg: arm64-windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Graph dependencies (Windows)
        if: runner.os == 'Windows' && matrix.profile == 'graph'
        shell: pwsh
        env:
          VCPKG_TARGET: ${{ matrix.platform.vcpkg }}
        run: |
          vcpkg install "openssl:$env:VCPKG_TARGET"
          $installed = "$env:VCPKG_INSTALLATION_ROOT/installed/$env:VCPKG_TARGET"
          Copy-Item "$installed/lib/libssl.lib" "$installed/lib/ssl.lib"
          Copy-Item "$installed/lib/libcrypto.lib" "$installed/lib/crypto.lib"
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "OPENSSL_ROOT_DIR=$installed" >> $env:GITHUB_ENV
          "OPENSSL_BIN=$installed/bin" >> $env:GITHUB_ENV
          "RUSTFLAGS=-L native=$installed/lib" >> $env:GITHUB_ENV
          "VCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET" >> $env:GITHUB_ENV
      - name: Build isolated CLI
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          if [[ "$PROFILE:$TARGET" == graph:x86_64-apple-darwin ||
                "$PROFILE:$TARGET" == graph:aarch64-pc-windows-msvc ]]; then
            export LBUG_BUILD_FROM_SOURCE=1
          fi
          cargo build --release --locked -p rhiza-cli --bin rhiza \
            --no-default-features --features "$PROFILE,recorder-postcard-rpc"
      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          asset="rhiza-${PROFILE}-${TAG}-${TARGET}.tar.gz"
          mkdir -p target/release-assets
          cp target/release/rhiza "target/release-assets/rhiza-${PROFILE}"
          chmod 0755 "target/release-assets/rhiza-${PROFILE}"
          tar -C target/release-assets -czf "$asset" "rhiza-${PROFILE}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          $asset = "rhiza-$env:PROFILE-$env:TAG-$env:TARGET.zip"
          New-Item -ItemType Directory -Force target/release-assets | Out-Null
          Copy-Item target/release/rhiza.exe "target/release-assets/rhiza-$env:PROFILE.exe"
          if ($env:PROFILE -eq 'graph') {
            Copy-Item "$env:OPENSSL_BIN/libcrypto*.dll", "$env:OPENSSL_BIN/libssl*.dll" target/release-assets
          }
          Compress-Archive -Path target/release-assets/* -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Set-Content "$asset.sha256"
          "ASSET=$asset" >> $env:GITHUB_ENV
      - name: Upload CLI asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "$ASSET" "${ASSET}.sha256"

  oci:
    name: OCI build (${{ matrix.profile }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [sql, graph, kv]
        platform:
          - name: linux-amd64
            runner: ubuntu-24.04
            docker: linux/amd64
            suffix: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            docker: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push isolated image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          platforms: ${{ matrix.platform.docker }}
          build-args: RHIZA_PROFILE=${{ matrix.profile }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.profile }}:${{ github.event.release.tag_name }}-${{ matrix.platform.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-rhiza-${{ matrix.profile }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=release-rhiza-${{ matrix.profile }}-${{ matrix.platform.suffix }},ignore-error=true

  oci-manifest:
    name: OCI manifest (${{ matrix.profile }}, linux-amd64-arm64)
    needs: oci
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [sql, graph, kv]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture manifest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.profile }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG"
