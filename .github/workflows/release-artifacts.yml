name: Release artifacts

on:
  release:
    types: [published]

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  cli:
    name: CLI (${{ matrix.profile }}, linux-amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: [sql, graph, kv]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated CLI
        run: >-
          cargo build --release --locked -p rhiza-cli --bin rhiza
          --no-default-features --features ${{ matrix.profile }},recorder-postcard-rpc
      - name: Package CLI
        env:
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="rhiza-${PROFILE}-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          install -D -m 0755 target/release/rhiza "target/release-assets/rhiza-${PROFILE}"
          tar -C target/release-assets -czf "$asset" "rhiza-${PROFILE}"
          sha256sum "$asset" > "${asset}.sha256"
      - name: Upload CLI asset
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="rhiza-${PROFILE}-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          gh release upload "$TAG" "$asset" "${asset}.sha256"

  oci:
    name: OCI (${{ matrix.profile }}, linux-amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [sql, graph, kv]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push isolated image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: RHIZA_PROFILE=${{ matrix.profile }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.profile }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-rhiza-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=release-rhiza-${{ matrix.profile }}
