name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable release tag to publish
        required: true
        type: string
      confirm:
        description: Type "publish crates" to confirm the permanent upload
        required: true
        type: string

concurrency:
  group: crates-io
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm == 'publish crates'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Require an exact immutable tag
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_REF"
          test "$(git cat-file -t "refs/tags/$RELEASE_REF")" = tag
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify publishable profiles
        run: |
          cargo test --locked -p rhiza-kv
          cargo test --locked -p rhiza-node --no-default-features --features kv --test kv_runtime
          cargo test --locked -p rhiza-client --no-default-features --features kv
      - name: Publish dependency tiers
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          published() {
            curl -fsSL "https://crates.io/api/v1/crates/$1/$2" >/dev/null 2>&1
          }
          wait_for_registry() {
            for _ in $(seq 1 30); do
              published "$1" "$2" && return 0
              sleep 10
            done
            echo "timed out waiting for $1 $2 on crates.io" >&2
            return 1
          }
          publish() {
            package="$1"
            version="$2"
            actual="$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg package "$package" '.packages[] | select(.name == $package) | .version')"
            test "$actual" = "$version"
            if published "$package" "$version"; then
              echo "$package $version is already published; continuing the same tagged release"
            else
              cargo publish --locked -p "$package"
            fi
            wait_for_registry "$package" "$version"
          }

          publish rhiza-kv 0.1.0
          publish rhiza-graph 0.2.0
          publish rhiza-node 0.4.0
          publish rhizadb 0.4.0
          publish rhiza-client 0.1.0
